<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VulnScan Console</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="topbar">
    <div class="brand">
        <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 2L3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4z" stroke="#35D6C4" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="11" r="2.6" stroke="#35D6C4" stroke-width="1.4"/>
            </svg>
        </span>
        VULNSCAN <small>web console</small>
    </div>
    <div class="status-pill idle mono" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">idle</span>
    </div>
</div>

<div class="layout">
    <!-- Sidebar: scan config + history -->
    <div class="sidebar">
        <div>
            <div class="panel-label">scan config</div>
            <form id="scanForm">
                <div class="field">
                    <label for="target">target url</label>
                    <input type="text" id="target" name="target" placeholder="http://127.0.0.1:5000" required>
                </div>
                <div class="field">
                    <label for="loginUrl">login path <span style="color:var(--text-dim)">(optional)</span></label>
                    <input type="text" id="loginUrl" name="login_url" placeholder="/login">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="username">username</label>
                        <input type="text" id="username" name="username" placeholder="alice">
                    </div>
                    <div class="field">
                        <label for="password">password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••">
                    </div>
                </div>
                <div class="field">
                    <label for="maxPages">max pages to crawl</label>
                    <input type="number" id="maxPages" name="max_pages" value="25" min="1" max="200">
                </div>
                <button type="submit" class="run-btn" id="runBtn">▶ RUN SCAN</button>
                <div class="error-msg" id="errorMsg"></div>
            </form>
        </div>

        <div>
            <div class="panel-label">scan history</div>
            <div class="history-list" id="historyList">
                <div class="history-empty">No scans yet this session.</div>
            </div>
        </div>
    </div>

    <!-- Main: results -->
    <div class="main" id="mainArea">
        <div class="main-empty">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4z" stroke="#4A5265" stroke-width="1.2"/></svg>
            <h2>No scan running</h2>
            <p>Configure a target on the left and run a scan to see live progress and findings here.</p>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
